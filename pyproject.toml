[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yayashare"
version = "1.1.0"
description = "Private LAN sharing for macOS and Windows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PySide6>=6.8,<7", "cryptography>=44,<51"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6.12,<7"]

[project.scripts]
yayashare = "yayashare.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yayashare = ["assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
