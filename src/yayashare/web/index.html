<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark"><meta name="referrer" content="no-referrer">
  <title>YayaShare · 手机互传</title>
  <link rel="icon" href="/icon.png"><link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
<main>
  <header><img src="/icon.png" width="48" height="48" alt=""><div><h1>YayaShare</h1><p id="connection">正在连接电脑…</p></div><span class="badge">手机互传</span></header>
  <aside>仅限可信局域网 · 网页传输未加密，请勿发送密码或敏感文件。</aside>
  <p id="status" role="status" aria-live="polite">正在验证临时连接…</p>
  <section aria-labelledby="send-title">
    <h2 id="send-title">发送到电脑</h2>
    <label for="text">文字 / 链接</label>
    <textarea id="text" rows="4" placeholder="在这里粘贴或输入文字…" maxlength="65536"></textarea>
    <button id="send-text" disabled>发送文字</button>
    <div class="file-area"><label for="files">照片或文件 <small>每个最大 256 MiB</small></label>
      <input id="files" type="file" multiple>
      <p id="selection">可从照片图库或「文件」中选择；多份文件按顺序发送。</p>
      <div class="actions"><button id="send-files" disabled>发送选中文件</button><button id="cancel" class="secondary" hidden>取消</button></div>
      <progress id="progress" max="100" value="0" hidden aria-label="上传进度"></progress>
    </div>
  </section>
  <section aria-labelledby="receive-title">
    <div class="section-heading"><h2 id="receive-title">从电脑接收</h2><button id="refresh" class="secondary" disabled>刷新</button></div>
    <p id="empty">电脑主动分享的内容会出现在这里。不会显示电脑的历史记录。</p>
    <div id="items"></div>
  </section>
  <footer>保持电脑与手机联网，传输时不要锁屏。<br>入口 30 分钟有效；重新开启后请重新扫码。校园网设备隔离可能阻止连接。</footer>
</main>
</body></html>
